<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Para Mi Amor ❤️</title>

<style>
body{
    background: linear-gradient(135deg,#ff9ecf,#ffd6e7);
    font-family: Arial, sans-serif;
    text-align:center;
    padding-top:100px;
    color:white;
}

.carta{
    background: rgba(255,255,255,0.15);
    padding:40px;
    width:70%;
    margin:auto;
    border-radius:20px;
    backdrop-filter: blur(10px);
}

h1{
    font-size:45px;
}

p{
    font-size:24px;
}
</style>
</head>

<body>

<div class="carta">
<h1>❤️ Para la niña de mis ojos ❤️</h1>

<p>
Te amo más de lo que las palabras pueden expresar.
</p>

<p>
Eres la princesa de mi corazón y cada día a tu lado es un regalo.
</p>

<p>
Juntos podemos lograrlo todo.
</p>

<p>
Y deseo que sigamos juntos y felices por siempre. 💖
</p>

<p>
Con amor,<br>
Ricardo
</p>

</div>

</body>
</html>
